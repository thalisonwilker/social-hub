<header class="sticky top-0 z-20 flex h-14 items-center gap-3 border-b border-line bg-surface/90 px-4 backdrop-blur sm:px-6 lg:px-8">
  <button type="button" data-sidebar-open class="btn btn-ghost -ml-2 p-2 lg:hidden" aria-label="Abrir menu">
    <i data-lucide="menu" class="h-5 w-5"></i>
  </button>

  <h1 class="truncate text-base font-semibold tracking-tight">{{ page_title|default:"Social Hub" }}</h1>

  <div class="ml-auto flex items-center gap-1 sm:gap-2">
    {% if active_profile %}
    <a href="{% url 'social:profile_select' %}" data-profile-chip data-hue="{{ active_profile.hue }}" data-initial="{{ active_profile.initial }}" data-name="{{ active_profile.name }}" class="flex items-center gap-2 rounded px-1.5 py-1 hover:bg-surface-2" title="Trocar de perfil">
      <span class="flex h-7 w-7 items-center justify-center rounded-full text-xs font-semibold text-white" style="background:linear-gradient(135deg,hsl({{ active_profile.hue }} 80% 55%),hsl({{ active_profile.hue|add:50 }} 75% 38%))">{{ active_profile.initial }}</span>
      <span class="hidden max-w-[10rem] truncate text-sm font-medium sm:block">{{ active_profile.name }}</span>
      <i data-lucide="chevrons-up-down" class="hidden h-4 w-4 text-muted sm:block"></i>
    </a>
    <div class="mx-1 hidden h-6 w-px bg-line sm:block"></div>
    {% endif %}
    <button type="button" data-theme-toggle class="btn btn-ghost p-2" aria-label="Alternar tema claro/escuro" title="Alternar tema">
      <i data-lucide="sun" class="hidden h-[18px] w-[18px] dark:block"></i>
      <i data-lucide="moon" class="h-[18px] w-[18px] dark:hidden"></i>
    </button>

    <div class="mx-1 hidden h-6 w-px bg-line sm:block"></div>

    <a href="{% url 'accounts:profile' %}" class="flex items-center gap-2 rounded px-1.5 py-1 hover:bg-surface-2">
      <span class="flex h-7 w-7 items-center justify-center rounded-full bg-accent text-xs font-semibold uppercase text-accent-fg">{{ request.user.username|slice:":1" }}</span>
      <span class="hidden text-sm font-medium sm:block">{{ request.user.get_username }}</span>
    </a>

    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-ghost p-2" aria-label="Sair" title="Sair"><i data-lucide="log-out" class="h-[18px] w-[18px]"></i></button>
    </form>
  </div>
</header>
