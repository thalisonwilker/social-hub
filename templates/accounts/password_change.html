{% extends "layout.html" %}
{% block content %}
<form method="post" class="card max-w-lg space-y-4 p-6" novalidate>
  {% csrf_token %}
  <h2 class="card-title">Alterar senha</h2>

  {% for field in form %}
    <div>
      <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="mt-1 text-xs text-muted">{{ field.help_text|safe }}</div>{% endif %}
      {% for error in field.errors %}<p class="mt-1 text-xs text-danger">{{ error }}</p>{% endfor %}
    </div>
  {% endfor %}

  <div class="flex gap-2 pt-1">
    <button type="submit" class="btn btn-primary">Salvar nova senha</button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-ghost">Cancelar</a>
  </div>
</form>
{% endblock %}
