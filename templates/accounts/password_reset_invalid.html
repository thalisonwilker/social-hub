{% extends "accounts/_auth_base.html" %}
{% block title %}Link inválido · Social Hub{% endblock %}

{% block auth_content %}
<h1 class="text-2xl font-semibold tracking-tight">Link inválido</h1>
<div class="mt-6 border-l-2 border-l-danger px-3 py-2 text-sm text-danger" role="alert">Este link de redefinição é inválido ou expirou. Solicite um novo.</div>
<a href="{% url 'accounts:password_reset' %}" class="btn btn-primary mt-6 w-full py-2.5 text-base">Solicitar novo link</a>
{% endblock %}
