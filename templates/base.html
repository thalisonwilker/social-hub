{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Social Hub{% endblock %}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='2' fill='%23c2410c'/%3E%3Cpath d='M9 22V10h4l3 5 3-5h4v12h-3v-7l-3 5h-2l-3-5v7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preload" href="{% static 'dist/fonts/inter-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'dist/css/app.css' %}">
  <script>
    /* Aplica o tema antes da renderização para evitar "flash" de tema errado. */
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.classList.toggle("dark", theme === "dark");
    })();
  </script>
</head>
<body>
  {% block body %}{% endblock %}
  <script src="{% static 'dist/vendor/lucide.min.js' %}"></script>
  <script src="{% static 'dist/js/mui.js' %}"></script>
  <script src="{% static 'js/poll.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
