services:
  web:
    build: .
    image: social-hub:latest
    container_name: social-hub
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_PATH: /data/db.sqlite3
      # SQLite aceita bem poucos workers; ajuste conforme a necessidade.
      GUNICORN_CMD_ARGS: "--workers ${GUNICORN_WORKERS:-2} --access-logfile - --error-logfile -"
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite_data:
