services:
  web:
    build: .
    image: social-hub:latest
    container_name: social-hub
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /media
      # SQLite aceita bem poucos workers; ajuste conforme a necessidade.
      # --timeout 180: um lote de publicação (5 uploads de até 30 s) pode passar dos 30 s padrão.
      GUNICORN_CMD_ARGS: "--workers ${GUNICORN_WORKERS:-2} --timeout 180 --access-logfile - --error-logfile -"
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
      - media_data:/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Worker de envio (spec 0007): publica em segundo plano. Mesma imagem e mesmos volumes do `web`; não roda migrações.
  worker:
    build: .
    image: social-hub:latest
    container_name: social-hub-worker
    restart: unless-stopped
    command: ["python", "manage.py", "run_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /media
      RUN_MIGRATIONS: "0"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - sqlite_data:/data
      - media_data:/media
    # SIGTERM: o worker termina o alvo em andamento (Status/Threads podem levar > 1 min) e sai; depois disso o Docker mata.
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  sqlite_data:
  media_data:
